name: Build 5.10 gen4m + mt7601u

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout gen4m fork
        uses: actions/checkout@v4
        with:
          path: gen4m

      - name: Checkout kernel Google 5.10
        run: |
          git clone --depth 1 -b android12-5.10 https://android.googlesource.com/kernel/common common
          git clone --depth 1 -b android12-5.10 https://android.googlesource.com/kernel/prebuilts/clang/host/linux-x86 prebuilts-clang
          git clone --depth 1 -b android12-5.10 https://android.googlesource.com/kernel/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 prebuilts-gcc

      - name: Setup env
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV

      - name: Build modules 1 paket
        run: |
          cd common
          # Pake defconfig GKI 5.10, bukan defconfig HP lu dulu, biar gampang ke-build
          make ARCH=arm64 O=out gki_defconfig
          make ARCH=arm64 O=out modules_prepare -j$(nproc)

          # 1. cfg80211 + mac80211 + mt7601u dari Google
          make ARCH=arm64 O=out M=net/wireless modules -j$(nproc)
          make ARCH=arm64 O=out M=net/mac80211 modules -j$(nproc)
          make ARCH=arm64 O=out M=drivers/net/wireless/mediatek/mt7601u modules -j$(nproc)

          # 2. Copy Module.symvers ke gen4m biar CRC sama
          cp out/Module.symvers ../gen4m/
          cp out/.config ../gen4m/ || true

          # 3. Build gen4m dari fork lu
          make ARCH=arm64 O=out M=$GITHUB_WORKSPACE/gen4m modules -j$(nproc)

          # 4. Kumpulin hasil
          mkdir -p $GITHUB_WORKSPACE/out_ko
          find out -name "cfg80211.ko" -exec cp {} $GITHUB_WORKSPACE/out_ko/ \;
          find out -name "mac80211.ko" -exec cp {} $GITHUB_WORKSPACE/out_ko/ \;
          find out -name "mt7601u.ko" -exec cp {} $GITHUB_WORKSPACE/out_ko/ \;
          find $GITHUB_WORKSPACE/gen4m -name "wlan_drv_mt6789.ko" -exec cp {} $GITHUB_WORKSPACE/out_ko/ \; || find $GITHUB_WORKSPACE/gen4m -name "*.ko" -exec cp {} $GITHUB_WORKSPACE/out_ko/ \;
          ls -lh $GITHUB_WORKSPACE/out_ko/
          modinfo $GITHUB_WORKSPACE/out_ko/*.ko | grep -E "filename|vermagic"

      - name: Upload KO
        uses: actions/upload-artifact@v4
        with:
          name: ko-5.10.209
          path: out_ko/
